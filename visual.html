<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material visual PISA · JVS</title><style>body{font:15px system-ui;margin:0;background:#f7f8fa;color:#253044}main{max-width:820px;margin:auto;padding:14px}h1{font-size:20px}img{display:block;width:100%;height:auto;margin:12px 0;background:white;border:1px solid #ddd;border-radius:9px}p{line-height:1.5}</style><main><h1>Material visual de la actividad</h1><p id="status">Cargando documento original sin solucionario...</p><div id="images"></div></main><script>
(async()=>{const params=new URLSearchParams(location.search),file=params.get('file'),n=Number(params.get('n'));const status=document.getElementById('status');if(!file||!Number.isInteger(n)||n<1){status.textContent='Referencia no válida.';return;}
try{const response=await fetch('./repositorio.html');if(!response.ok)throw Error('No se pudo consultar el repositorio visual');const raw=await response.text();const start=raw.indexOf('const DATA=');const end=raw.indexOf(';\nconst CATS=',start);if(start<0||end<0)throw Error('Formato de repositorio no reconocido');const all=JSON.parse(raw.slice(start+11,end));const activity=all.find(x=>x.file===file),question=activity?.questions?.find(x=>Number(x.n)===n);if(!question)throw Error('No se encontró la pregunta solicitada');status.textContent='Documento: '+activity.title+' · Pregunta '+n+'. Imágenes originales de contexto y enunciado.';const holder=document.getElementById('images');for(const [i,src] of [...(activity.context||[]),...(question.images||[])].entries()){if(!src.startsWith('data:image/'))continue;const img=document.createElement('img');img.src=src;img.alt='Imagen original '+(i+1)+' de '+activity.title;img.loading='lazy';holder.append(img);}}catch(e){status.textContent='No se puede mostrar el material visual: '+e.message;}})();
</script></html>
